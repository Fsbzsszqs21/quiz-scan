<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>试题扫描解题</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #22c55e;
    --accent-dark: #16a34a;
    --line: #334155;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    font-size: 15px;
  }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: env(safe-area-inset-top) 12px calc(12px + env(safe-area-inset-bottom));
  }
  header { padding: 10px 2px 6px; }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  #status { margin-top: 4px; font-size: 13px; color: var(--muted); min-height: 18px; }
  .camera {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    background: #000;
    aspect-ratio: 4 / 3;
    margin-bottom: 10px;
  }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #shoot {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #052e16;
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  #shoot:active { background: var(--accent-dark); }
  #shoot:disabled { background: var(--line); color: var(--muted); }
  .mode-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .mode-opt { flex: 1; }
  .mode-opt input { display: none; }
  .mode-opt span {
    display: block;
    text-align: center;
    padding: 9px 4px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--muted);
    font-size: 14px;
  }
  .mode-opt input:checked + span {
    border-color: var(--accent);
    background: var(--accent);
    color: #052e16;
    font-weight: 700;
  }
  #result { flex: 1; overflow-y: auto; padding-bottom: 8px; }
  .card {
    background: var(--panel);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    border: 1px solid var(--line);
  }
  .card-head {
    font-size: 14px;
    font-weight: 700;
    color: #86efac;
    border-bottom: 2px solid var(--line);
    padding-bottom: 8px;
    margin-bottom: 10px;
  }
  .label { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .value { white-space: pre-wrap; word-break: break-word; line-height: 1.6; }
  .options { margin-top: 6px; line-height: 1.7; }
  .answer {
    white-space: pre-wrap;
    font-size: 17px;
    font-weight: 700;
    color: #fbbf24;
    padding: 8px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin-top: 10px;
  }
  .answer.qa {
    font-size: 15px;
    font-weight: 400;
    color: var(--text);
    line-height: 1.7;
  }
  .explain { white-space: pre-wrap; line-height: 1.6; margin-top: 10px; }
  .notice {
    background: #3f2d17;
    color: #fcd34d;
    border: 1px solid #92400e;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 10px;
  }
  pre.stream {
    white-space: pre-wrap;
    word-break: break-word;
    font-family: inherit;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
    margin: 0;
  }
  details {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 14px;
    margin-top: 8px;
  }
  summary { cursor: pointer; font-size: 14px; color: var(--muted); }
  details[open] summary { margin-bottom: 10px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .field label { font-size: 13px; color: var(--muted); }
  input[type="password"], input[type="text"] {
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    font-size: 15px;
  }
  .switch { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 8px 0 0; }
</style>
</head>
<body>
<header>
  <h1>试题扫描解题</h1>
  <div id="status">正在启动摄像头…</div>
</header>

<div class="camera">
  <video id="video" playsinline autoplay muted></video>
</div>

<div class="mode-row">
  <label class="mode-opt"><input type="radio" name="mode" value="auto" checked><span>自动</span></label>
  <label class="mode-opt"><input type="radio" name="mode" value="choice"><span>选择题</span></label>
  <label class="mode-opt"><input type="radio" name="mode" value="qa"><span>简答题</span></label>
</div>

<button id="shoot" disabled>拍照并解答</button>

<div id="result"></div>

<details>
  <summary>设置</summary>
  <div class="field">
    <label for="key">DeepSeek API Key（仅保存在本机浏览器）</label>
    <input id="key" type="password" autocomplete="off" placeholder="sk-...">
  </div>
  <div class="field switch">
    <input id="detail" type="checkbox">
    <label for="detail" style="color:var(--text)">详细解析（开启思考模式，较慢但更准）</label>
  </div>
  <p class="hint">摄像头需要 HTTPS 或 localhost 才能使用。图片与解答只在当前页面内存中处理，关闭或刷新页面即丢弃，不会保存到本地。</p>
</details>

<script>
const API_URL = 'https://api.deepseek.com/chat/completions';
const MODEL = 'deepseek-flash';
const MAX_SIDE = 1600;
const STORE_KEY = 'quiz_api_key';
const STORE_MODE = 'quiz_mode';

const SYSTEM_PROMPT = '你是严谨的试题解答助手。用户会给你一张可能包含多道试题的图片，请完成：\n'
  + '1. 按从上到下的顺序逐题识别，转写题号、题干、选项和公式（公式用 LaTeX 表示），不要遗漏或改写；\n'
  + '2. 判断题型：只有一个正确选项为“单选”，有两个及以上正确选项为“多选”，没有选项、需要文字作答的为“简答”；\n'
  + '3. 先判断每道题是否拍摄完整：题干缺失或被截断、选项文字残缺或被画面边缘切掉、关键条件看不清，都算不完整；\n'
  + '4. 只对完整的题目作答，不完整的题不要猜测答案；\n'
  + '5. 只输出一个 JSON 对象，不要输出任何解释性文字或代码块标记；\n'
  + '6. 所有键和字符串值都必须用半角双引号完整包裹，字符串内部不要出现半角双引号（需要引用时改用中文引号）。';

// 自动模式：同时处理选择题和简答题
const MIXED_PROMPT = '请识别并解答图片中的所有题目，严格按下面的 JSON 结构输出：\n'
  + '{"题目": [{"序号": 1, "题型": "单选/多选/简答", "题干": "题目原文", '
  + '"选项": {"A": "选项内容", "B": "选项内容"}, "完整": true, "缺失原因": "", '
  + '"答案": ["A"], "解析": "推理过程与结论"}]}\n'
  + '规则：\n'
  + '- 按题目在图片中的先后顺序编号，题目之间不要合并；\n'
  + '- 选择题：题型填“单选”或“多选”，选项字段填 A/B/C/D 等内容，答案用选项字母数组表示，单选只含一个元素；\n'
  + '- 简答题：题型填“简答”，选项填 {}，答案用文字完整作答，建议 50~100 字（不强制限制），解析可留空；\n'
  + '- 不完整的题把“完整”设为 false，在“缺失原因”中写明原因（如“缺少题干”“选项不全”“题面被截断”），答案留空；\n'
  + '- 判断题等题型只有两个选项属于正常情况，不要仅因选项数量少于四个判为不完整；\n'
  + '- 若图片中没有可识别的题目，输出 {"题目": []}。';

// 选择题模式：只处理单选/多选
const CHOICE_PROMPT = '请识别并解答图片中的所有选择题，严格按下面的 JSON 结构输出：\n'
  + '{"题目": [{"序号": 1, "题型": "单选或多选", "题干": "题目原文", '
  + '"选项": {"A": "选项内容", "B": "选项内容"}, "完整": true, "缺失原因": "", '
  + '"答案": ["A"], "解析": "推理过程与结论"}]}\n'
  + '规则：\n'
  + '- 只输出选择题，遇到简答题等非选择题直接跳过；\n'
  + '- 按题目在图片中的先后顺序编号，题目之间不要合并；\n'
  + '- 答案用选项字母数组表示，单选只含一个元素；\n'
  + '- 不完整的题把“完整”设为 false，在“缺失原因”中写明原因（如“缺少题干”“选项不全”“题面被截断”），答案留空数组、解析留空字符串；\n'
  + '- 判断题等题型只有两个选项属于正常情况，不要仅因选项数量少于四个判为不完整；\n'
  + '- 若图片中没有可识别的题目，输出 {"题目": []}。';

// 简答题模式：只处理需要文字作答的题目
const QA_PROMPT = '请识别并解答图片中的所有简答题，严格按下面的 JSON 结构输出：\n'
  + '{"题目": [{"序号": 1, "题型": "简答", "题干": "题目原文", "选项": {}, '
  + '"完整": true, "缺失原因": "", "答案": "参考答案", "解析": ""}]}\n'
  + '规则：\n'
  + '- 只输出简答题，遇到选择题直接跳过；\n'
  + '- 按题目在图片中的先后顺序编号，题目之间不要合并；\n'
  + '- “答案”用文字完整作答，讲清关键要点，建议 50~100 字，不强制限制长度；\n'
  + '- 不完整的题把“完整”设为 false，在“缺失原因”中写明原因，答案留空字符串；\n'
  + '- 若图片中没有可识别的题目，输出 {"题目": []}。';

const SHORT_HINT = '\n额外要求：每道题的“解析”控制在 60 字以内，只写结论和关键理由。';

const video = document.getElementById('video');
const shootBtn = document.getElementById('shoot');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const keyInput = document.getElementById('key');
const detailBox = document.getElementById('detail');

let busy = false;

function setStatus(text) { statusEl.textContent = text; }

function cleanText(value) {
  return String(value == null ? '' : value).replace(/\\r\\n|\\n/g, '\n').trim();
}

function remember(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { /* 存储已满时忽略 */ }
}

async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus('当前浏览器不支持摄像头调用，请改用 Chrome/Edge 或 Safari');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false,
    });
    video.srcObject = stream;
    await video.play();
    shootBtn.disabled = false;
    setStatus('对准题目，点击「拍照并解答」');
  } catch (err) {
    setStatus('无法打开摄像头：' + err.message + '（需 HTTPS 或 localhost 访问）');
  }
}

function captureBase64() {
  const w = video.videoWidth || 1280;
  const h = video.videoHeight || 720;
  const scale = Math.min(1, MAX_SIDE / Math.max(w, h));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(w * scale);
  canvas.height = Math.round(h * scale);
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
  return dataUrl.slice(dataUrl.indexOf(',') + 1);
}

function getMode() {
  const checked = document.querySelector('input[name="mode"]:checked');
  return checked ? checked.value : 'auto';
}

function buildPrompt(mode, detailed) {
  const base = mode === 'qa' ? QA_PROMPT : (mode === 'choice' ? CHOICE_PROMPT : MIXED_PROMPT);
  return detailed ? base : base + SHORT_HINT;
}

function tryRepair(text) {
  let variants = [text];
  const repairs = [
    s => s.replace(/(:\s*)([^"\s{}\[\],][^",{}\[\]]*?)(")/g, '$1"$2$3'),
    s => s.replace(/[\u201c\u201d]/g, '"'),
    s => s.replace(/,\s*([}\]])/g, '$1'),
    s => s.replace(/'/g, '"'),
  ];
  for (const repair of repairs) {
    variants = variants.concat(variants.map(repair));
  }
  for (const variant of variants) {
    try { return JSON.parse(variant); } catch (e) { /* 继续尝试 */ }
  }
  return null;
}

function parseJsonLoose(content) {
  let text = String(content || '').trim();
  if (text.startsWith('```')) {
    text = text.replace(/^```[a-zA-Z]*\s*/, '').replace(/\s*```$/, '');
  }
  const candidates = [text];
  const start = text.indexOf('{');
  const end = text.lastIndexOf('}');
  if (start >= 0 && end > start) candidates.push(text.slice(start, end + 1));
  for (const candidate of candidates) {
    const parsed = tryRepair(candidate);
    if (parsed) return parsed;
  }
  return null;
}

function splitQuestions(item) {
  if (!item || typeof item !== 'object') return [];
  if (Array.isArray(item['题目'])) {
    return item['题目'].filter(q => q && typeof q === 'object');
  }
  if (item['题干']) return [item];
  return [];
}

function checkComplete(question) {
  if (!String(question['题干'] || '').trim()) return [false, '缺少题干'];
  const type = String(question['题型'] || '').trim();
  const options = question['选项'];
  const hasOptions = options && typeof options === 'object' && Object.keys(options).length > 0;
  if ((type === '单选' || type === '多选') && !hasOptions) return [false, '选项不全'];
  if (question['完整'] === false) return [false, String(question['缺失原因'] || '拍摄不完整')];
  return [true, ''];
}

function filterQuestions(questions) {
  const answered = [];
  const skipped = [];
  questions.forEach((question, index) => {
    const [ok, reason] = checkComplete(question);
    if (ok) answered.push([index + 1, question]);
    else skipped.push([index + 1, reason]);
  });
  return { answered, skipped };
}

function addField(card, label, value, className) {
  const labelEl = document.createElement('div');
  labelEl.className = 'label';
  labelEl.textContent = label;
  const valueEl = document.createElement('div');
  valueEl.className = className || 'value';
  valueEl.textContent = value;
  card.appendChild(labelEl);
  card.appendChild(valueEl);
}

function renderResult(answered, skipped) {
  resultEl.innerHTML = '';
  answered.forEach(([index, question]) => {
    const card = document.createElement('div');
    card.className = 'card';

    const head = document.createElement('div');
    head.className = 'card-head';
    head.textContent = '第 ' + index + ' 题｜' + (question['题型'] || '未知');
    card.appendChild(head);

    addField(card, '题干', cleanText(question['题干']));

    const isQA = String(question['题型'] || '').includes('简答');
    const options = question['选项'];
    if (!isQA && options && typeof options === 'object' && Object.keys(options).length) {
      const list = document.createElement('div');
      list.className = 'options';
      for (const [name, value] of Object.entries(options)) {
        const row = document.createElement('div');
        row.textContent = name + '. ' + cleanText(value);
        list.appendChild(row);
      }
      card.appendChild(list);
    }

    const answer = Array.isArray(question['答案'])
      ? question['答案'].join('、')
      : cleanText(question['答案']);
    const answerEl = document.createElement('div');
    answerEl.className = isQA ? 'answer qa' : 'answer';
    answerEl.textContent = (isQA ? '参考答案：' : '答案：') + (answer || '（无）');
    card.appendChild(answerEl);

    const explain = cleanText(question['解析']);
    if (explain) {
      const explainEl = document.createElement('div');
      explainEl.className = 'explain';
      explainEl.textContent = '解析：' + explain;
      card.appendChild(explainEl);
    }

    resultEl.appendChild(card);
  });

  if (skipped.length) {
    const notice = document.createElement('div');
    notice.className = 'notice';
    notice.textContent = '已剔除 ' + skipped.length + ' 道不完整题目：'
      + skipped.map(([index, reason]) => '第 ' + index + ' 题（' + reason + '）').join('；');
    resultEl.prepend(notice);
  }
}

async function solve(base64, apiKey, prompt, detailed, onStream) {
  const payload = {
    model: MODEL,
    messages: [
      { role: 'system', content: SYSTEM_PROMPT },
      {
        role: 'user',
        content: [
          { type: 'image_url', image_url: { url: 'data:image/jpeg;base64,' + base64, detail: 'high' } },
          { type: 'text', text: prompt },
        ],
      },
    ],
    temperature: 0.2,
    max_tokens: detailed ? 4000 : 1500,
    stream: true,
  };
  if (!detailed) payload.reasoning_effort = 'none';

  const started = performance.now();
  const response = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
    body: JSON.stringify(payload),
  });
  if (!response.ok) {
    let message = 'HTTP ' + response.status;
    try {
      const body = await response.json();
      message = (body.error && body.error.message) || message;
    } catch (e) { /* 非 JSON 错误体 */ }
    throw new Error(message);
  }

  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let pending = '';
  let content = '';
  let lastPush = 0;

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    pending += decoder.decode(value, { stream: true });
    const lines = pending.split('\n');
    pending = lines.pop();
    for (let line of lines) {
      line = line.trim();
      if (!line.startsWith('data:')) continue;
      const data = line.slice(5).trim();
      if (data === '[DONE]') { pending = ''; break; }
      let chunk;
      try { chunk = JSON.parse(data); } catch (e) { continue; }
      if (!chunk.choices || !chunk.choices.length) continue;
      const piece = (chunk.choices[0].delta && chunk.choices[0].delta.content) || '';
      if (!piece) continue;
      content += piece;
      const now = Date.now();
      if (now - lastPush >= 120) {
        onStream(content);
        lastPush = now;
      }
    }
  }

  return { content, elapsed: (performance.now() - started) / 1000 };
}

async function shoot() {
  if (busy) return;
  const apiKey = keyInput.value.trim();
  if (!apiKey) {
    setStatus('请先在「设置」里填写 DeepSeek API Key');
    return;
  }
  busy = true;
  shootBtn.disabled = true;
  resultEl.innerHTML = '';
  const streamEl = document.createElement('pre');
  streamEl.className = 'stream';
  streamEl.textContent = '正在识别题目…';
  resultEl.appendChild(streamEl);
  setStatus('已拍照，正在识别并解答…');

  try {
    const base64 = captureBase64();
    const mode = getMode();
    const detailed = detailBox.checked;
    const prompt = buildPrompt(mode, detailed);
    const { content, elapsed } = await solve(base64, apiKey, prompt, detailed, text => {
      streamEl.textContent = cleanText(text);
    });

    const item = parseJsonLoose(content);
    if (!item) {
      streamEl.textContent = cleanText(content);
      setStatus('返回内容不是有效 JSON，已显示模型原文');
      return;
    }

    const questions = splitQuestions(item);
    const { answered, skipped } = filterQuestions(questions);

    if (!questions.length) {
      resultEl.innerHTML = '';
      const notice = document.createElement('div');
      notice.className = 'notice';
      notice.textContent = '图片中未识别到题目，请调整拍摄角度或距离后重试。';
      resultEl.appendChild(notice);
      setStatus('未识别到题目');
      return;
    }

    if (!answered.length) {
      resultEl.innerHTML = '';
      const notice = document.createElement('div');
      notice.className = 'notice';
      notice.textContent = '识别到的题目都不完整，已全部剔除：'
        + skipped.map(([index, reason]) => '第 ' + index + ' 题（' + reason + '）').join('；');
      resultEl.appendChild(notice);
      setStatus('识别到 ' + questions.length + ' 道题，均不完整');
      return;
    }

    renderResult(answered, skipped);

    let message = '解答 ' + answered.length + ' 道题，用时 ' + elapsed.toFixed(1) + ' 秒';
    if (skipped.length) message += '，剔除 ' + skipped.length + ' 道不完整题目';
    setStatus(message);
  } catch (err) {
    setStatus('解答失败：' + err.message);
    resultEl.innerHTML = '';
    const notice = document.createElement('div');
    notice.className = 'notice';
    notice.textContent = '解答失败：' + err.message + '。请检查 API Key、网络或账户余额。';
    resultEl.appendChild(notice);
  } finally {
    busy = false;
    shootBtn.disabled = false;
  }
}

function loadState() {
  try {
    keyInput.value = localStorage.getItem(STORE_KEY) || '';
    const savedMode = localStorage.getItem(STORE_MODE);
    if (savedMode) {
      const input = document.querySelector('input[name="mode"][value="' + savedMode + '"]');
      if (input) input.checked = true;
    }
  } catch (e) { /* 首次使用无数据 */ }
}

keyInput.addEventListener('change', () => remember(STORE_KEY, keyInput.value.trim()));
document.querySelectorAll('input[name="mode"]').forEach(input => {
  input.addEventListener('change', () => remember(STORE_MODE, input.value));
});
shootBtn.addEventListener('click', shoot);

loadState();
startCamera();
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => { /* 非 HTTPS 环境忽略 */ });
}
</script>
</body>
</html>
